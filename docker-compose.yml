version: '3.8'

services:
  nginx_proxy:
    build: ./nginx
    image: nginx_proxy:latest
    ports:
      - "80:80"
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  service_analyzer:
    build: ./service_analyzer
    image: service_analyzer:latest
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure

  service_visualizer:
    build: ./service_visualizer
    image: service_visualizer:latest
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
